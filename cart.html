<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen &middot; Cart</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="logo">LU<span>MEN</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Shop</a>
    <a href="cart.html" class="active">Cart</a>
  </nav>
  <div class="spacer"></div>
  <button class="icon-btn" onclick="demo('Search')">🔍 Search</button>
  <button class="icon-btn" onclick="demo('Account login')">Account</button>
  <a href="cart.html" class="cart-link"><button class="icon-btn">🛒 Cart<span class="badge" id="cartBadge">0</span></button></a>
</header>

<div class="wrap">
  <div>
    <h1>Your cart</h1>
    <div id="items"></div>
  </div>

  <div class="summary">
    <h2>Order summary</h2>
    <div class="row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
    <div class="row"><span>Shipping</span><span>Free</span></div>
    <div class="row"><span>Tax (est.)</span><span id="tax">$0.00</span></div>
    <div class="promo">
      <input type="text" placeholder="Promo code">
      <button onclick="demo('Apply promo code')">Apply</button>
    </div>
    <div class="row total"><span>Total</span><span id="total">$0.00</span></div>
    <button class="btn" onclick="demo('Checkout / Payment')">Checkout</button>
    <a href="products.html"><button class="btn ghost">Continue shopping</button></a>
    <div class="secure">🔒 Demo checkout — no real payment</div>
  </div>
</div>

<div class="toast" id="toast">Updated</div>

<script src="app.js"></script>
<script>
  renderCart();
  updateBadge();
</script>
</body>
</html>
