<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen &middot; Cart</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#ff7a59; --accent2:#5b8def;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5}
  a{color:inherit;text-decoration:none}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;
    padding:16px 32px;background:rgba(15,17,21,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .logo{font-weight:800;font-size:22px;letter-spacing:1px}
  .logo span{color:var(--accent)}
  nav{display:flex;gap:22px;margin-left:8px;font-size:15px}
  nav a{color:var(--muted);transition:color .15s}
  nav a:hover,nav a.active{color:var(--text)}
  .spacer{flex:1}
  .icon-btn{background:none;border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px;transition:border-color .15s}
  .icon-btn:hover{border-color:var(--accent)}
  .cart-link{position:relative}
  .badge{position:absolute;top:-8px;right:-8px;background:var(--accent);color:#fff;
    font-size:11px;font-weight:700;border-radius:20px;padding:1px 6px;min-width:18px;text-align:center}
  .wrap{max-width:1000px;margin:0 auto;padding:32px;display:grid;grid-template-columns:1fr 320px;gap:28px}
  @media(max-width:780px){.wrap{grid-template-columns:1fr}}
  h1{font-size:30px;margin-bottom:20px}
  .item{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:14px}
  .item .ico{width:64px;height:64px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
  .item .info{flex:1}
  .item .info h3{font-size:15px}
  .item .info .cat{color:var(--muted);font-size:12px}
  .item .price{color:var(--accent);font-weight:700;width:80px;text-align:right}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);cursor:pointer;font-size:16px}
  .qty button:hover{border-color:var(--accent)}
  .qty span{min-width:22px;text-align:center}
  .remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px}
  .remove:hover{color:#ff5959}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;
    padding:48px;text-align:center;color:var(--muted)}
  .empty .btn{margin-top:16px}
  .summary{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;height:fit-content;position:sticky;top:96px}
  .summary h2{font-size:18px;margin-bottom:16px}
  .row{display:flex;justify-content:space-between;margin-bottom:10px;color:var(--muted);font-size:14px}
  .row.total{color:var(--text);font-size:18px;font-weight:700;border-top:1px solid var(--line);
    padding-top:14px;margin-top:14px}
  .promo{display:flex;gap:8px;margin:16px 0}
  .promo input{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  .promo button{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
    color:var(--text);cursor:pointer}
  .btn{background:var(--accent);color:#fff;border:none;padding:13px;border-radius:12px;
    font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:transform .1s,opacity .15s}
  .btn:hover{transform:translateY(-1px);opacity:.92}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);margin-top:10px}
  .secure{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--accent);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;opacity:0;transition:all .25s;z-index:50}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo">LU<span>MEN</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Shop</a>
    <a href="cart.html" class="active">Cart</a>
  </nav>
  <div class="spacer"></div>
  <button class="icon-btn" onclick="demo('Search')">🔍 Search</button>
  <button class="icon-btn" onclick="demo('Account login')">Account</button>
  <a href="cart.html" class="cart-link"><button class="icon-btn">🛒 Cart<span class="badge" id="cartBadge">0</span></button></a>
</header>

<div class="wrap">
  <div>
    <h1>Your cart</h1>
    <div id="items"></div>
  </div>

  <div class="summary">
    <h2>Order summary</h2>
    <div class="row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
    <div class="row"><span>Shipping</span><span>Free</span></div>
    <div class="row"><span>Tax (est.)</span><span id="tax">$0.00</span></div>
    <div class="promo">
      <input type="text" placeholder="Promo code">
      <button onclick="demo('Apply promo code')">Apply</button>
    </div>
    <div class="row total"><span>Total</span><span id="total">$0.00</span></div>
    <button class="btn" onclick="demo('Checkout / Payment')">Checkout</button>
    <a href="products.html"><button class="btn ghost">Continue shopping</button></a>
    <div class="secure">🔒 Demo checkout — no real payment</div>
  </div>
</div>

<div class="toast" id="toast">Updated</div>

<script src="app.js"></script>
<script>
  renderCart();
  updateBadge();
</script>
</body>
</html>
