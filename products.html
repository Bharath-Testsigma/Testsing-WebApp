<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen &middot; Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="ticker">
  <div class="ticker__track">
    <span>Free shipping on demo orders ✺</span><span>Lumen Demo Store ✺</span><span>~60% of buttons work ✺</span><span>Not a real shop ✺</span>
    <span>Free shipping on demo orders ✺</span><span>Lumen Demo Store ✺</span><span>~60% of buttons work ✺</span><span>Not a real shop ✺</span>
  </div>
</div>

<header class="masthead">
  <div class="brand">LU<span>MEN</span></div>
  <div class="spacer"></div>
  <nav class="mainnav">
    <a class="navlink" href="index.html">Home</a>
    <a class="navlink is-active" href="products.html">Shop</a>
    <a class="navlink" href="cart.html">Cart<span class="badge" id="cartBadge">0</span></a>
  </nav>
  <button class="icon-btn" onclick="demo('Search')">🔍 Search</button>
  <button class="icon-btn" onclick="demo('Account login')">Account</button>
</header>

<main class="content">
  <section class="section">
    <div class="shopbar">
      <h1>The collection</h1>
      <select onchange="demo('Sort by ' + this.value)">
        <option>Sort: Featured</option>
        <option>Price: Low to High</option>
        <option>Price: High to Low</option>
        <option>Newest</option>
      </select>
    </div>

    <div class="filters">
      <button class="chip active" onclick="filterCat('all',this)">All</button>
      <button class="chip" onclick="filterCat('Home',this)">Home</button>
      <button class="chip" onclick="filterCat('Tech',this)">Tech</button>
      <button class="chip" onclick="filterCat('Wear',this)">Wear</button>
      <button class="chip" onclick="filterCat('Kitchen',this)">Kitchen</button>
    </div>

    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <div>© 2026 Lumen Demo Store · Built as an HTML demo</div>
    <div class="socials">
      Follow us
      <button onclick="demo('Twitter')">𝕏</button>
      <button onclick="demo('Instagram')">📷</button>
      <button onclick="demo('YouTube')">▶</button>
    </div>
  </footer>
</main>

<div class="toast" id="toast">Added to cart</div>

<script src="app.js"></script>
<script>
  let activeCat = 'all';
  function filterCat(cat, el){
    activeCat = cat;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
    renderShop();
  }
  function renderShop(){
    const list = activeCat==='all' ? PRODUCTS : PRODUCTS.filter(p=>p.cat===activeCat);
    document.getElementById('count').textContent = list.length + ' products';
    document.getElementById('grid').innerHTML = list.map(p=>`
      <div class="card">
        <div class="thumb" style="background:${p.bg}">${p.emoji}${p.tag?`<span class="tag">${p.tag}</span>`:''}</div>
        <div class="card-body">
          <h3>${p.name}</h3>
          <div class="cat">${p.cat}</div>
          <div class="price">$${p.price.toFixed(2)}</div>
          <div class="card-actions">
            <button class="btn" onclick="addToCart(${p.id})">Add to cart</button>
            <button class="wish" onclick="demo('Wishlist')">♡</button>
          </div>
        </div>
      </div>`).join('');
  }
  renderShop();
  updateBadge();
</script>
</body>
</html>
