<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen &middot; Shop</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="logo">LU<span>MEN</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html" class="active">Shop</a>
    <a href="cart.html">Cart</a>
  </nav>
  <div class="spacer"></div>
  <button class="icon-btn" onclick="demo('Search')">🔍 Search</button>
  <button class="icon-btn" onclick="demo('Account login')">Account</button>
  <a href="cart.html" class="cart-link"><button class="icon-btn">🛒 Cart<span class="badge" id="cartBadge">0</span></button></a>
</header>

<div class="shop-wrap">
  <aside class="sidebar">
    <h2>Categories</h2>
    <ul class="cat-list">
      <li><button class="cat-item active" onclick="filterCat('all',this)">All</button></li>
      <li><button class="cat-item" onclick="filterCat('Home',this)">Home</button></li>
      <li><button class="cat-item" onclick="filterCat('Tech',this)">Tech</button></li>
      <li><button class="cat-item" onclick="filterCat('Audio',this)">Audio</button></li>
      <li><button class="cat-item" onclick="filterCat('Wear',this)">Wear</button></li>
      <li><button class="cat-item" onclick="filterCat('Kitchen',this)">Kitchen</button></li>
    </ul>
    <h2>Sort</h2>
    <select onchange="demo('Sort by ' + this.value)">
      <option>Featured</option>
      <option>Price: Low to High</option>
      <option>Price: High to Low</option>
      <option>Newest</option>
    </select>
  </aside>

  <main class="shop-main">
    <div class="page-head">
      <h1>The collection</h1>
    </div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<footer class="center">© 2026 Lumen Demo Store · Built as an HTML demo</footer>

<div class="toast" id="toast">Added to cart</div>

<script src="app.js"></script>
<script>
  let activeCat = 'all';
  function filterCat(cat, el){
    activeCat = cat;
    document.querySelectorAll('.cat-item').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
    renderShop();
  }
  function renderShop(){
    const list = activeCat==='all' ? PRODUCTS : PRODUCTS.filter(p=>p.cat===activeCat);
    document.getElementById('count').textContent = list.length + ' products';
    document.getElementById('grid').innerHTML = list.map(p=>`
      <div class="card">
        <div class="thumb" style="background:${p.bg}">${p.emoji}${p.tag?`<span class="tag">${p.tag}</span>`:''}</div>
        <div class="card-body">
          <h3>${p.name}</h3>
          <div class="cat">${p.cat}</div>
          <div class="price">$${p.price.toFixed(2)}</div>
          <div class="card-actions">
            <button class="btn" onclick="addToCart(${p.id})">Add to cart</button>
            <button class="wish" onclick="demo('Wishlist')">♡</button>
          </div>
        </div>
      </div>`).join('');
  }
  renderShop();
  updateBadge();
</script>
</body>
</html>
