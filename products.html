<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen &middot; Shop</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#ff7a59; --accent2:#5b8def;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;display:flex;min-height:100vh}
  a{color:inherit;text-decoration:none}
  /* ---- left sidebar ---- */
  .sidebar{width:240px;flex-shrink:0;position:sticky;top:0;align-self:flex-start;height:100vh;
    background:var(--panel);border-right:1px solid var(--line);padding:26px 18px;
    display:flex;flex-direction:column;gap:22px;overflow-y:auto}
  .logo{font-weight:800;font-size:24px;letter-spacing:1px}
  .logo span{color:var(--accent)}
  nav{display:flex;flex-direction:column;gap:4px}
  nav a{color:var(--muted);padding:10px 12px;border-radius:10px;transition:all .15s}
  nav a:hover{background:var(--line);color:var(--text)}
  nav a.active{background:var(--accent);color:#fff}
  .divider{border:none;border-top:1px solid var(--line);margin:0}
  .filters{display:flex;flex-direction:column;gap:6px}
  .chip{background:none;border:1px solid var(--line);color:var(--muted);text-align:left;
    padding:8px 12px;border-radius:10px;cursor:pointer;font-size:13px;transition:all .15s}
  .chip:hover{border-color:var(--accent);color:var(--text)}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .side-tools{display:flex;flex-direction:column;gap:8px;margin-top:auto}
  .icon-btn{width:100%;text-align:left;background:none;border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px;transition:border-color .15s}
  .icon-btn:hover{border-color:var(--accent)}
  .cart-link{position:relative;display:block}
  .badge{position:absolute;top:-8px;right:-8px;background:var(--accent);color:#fff;
    font-size:11px;font-weight:700;border-radius:20px;padding:1px 6px;min-width:18px;text-align:center}
  /* ---- main content ---- */
  .content{flex:1;min-width:0}
  .wrap{max-width:1100px;margin:0 auto;padding:32px}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:12px}
  .page-head h1{font-size:32px}
  select{background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:7px 12px;border-radius:10px;font-size:13px;cursor:pointer}
  .count{color:var(--muted);font-size:14px;margin:18px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .15s}
  .card:hover{border-color:#3a4150}
  .thumb{height:160px;display:flex;align-items:center;justify-content:center;font-size:60px;position:relative}
  .tag{position:absolute;top:10px;left:10px;background:var(--accent2);color:#fff;font-size:11px;
    font-weight:700;padding:3px 8px;border-radius:6px}
  .card-body{padding:14px 16px}
  .card h3{font-size:15px;margin-bottom:4px}
  .card .cat{color:var(--muted);font-size:12px;margin-bottom:6px}
  .card .price{color:var(--accent);font-weight:700;margin-bottom:12px}
  .card-actions{display:flex;gap:8px}
  .btn{background:var(--accent);color:#fff;border:none;padding:9px 12px;border-radius:10px;
    font-size:13px;font-weight:600;cursor:pointer;flex:1;transition:transform .1s,opacity .15s}
  .btn:hover{transform:translateY(-1px);opacity:.92}
  .wish{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;
    width:40px;cursor:pointer;font-size:15px}
  .wish:hover{color:var(--accent)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--accent);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;
    opacity:0;transition:all .25s;z-index:50}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  footer{border-top:1px solid var(--line);padding:32px;color:var(--muted);font-size:13px;text-align:center;margin-top:40px}
  @media(max-width:820px){
    body{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;
      align-items:center;gap:10px;padding:14px 18px}
    nav,.filters{flex-direction:row;flex-wrap:wrap}
    .divider{display:none}
    .side-tools{flex-direction:row;margin-top:0;margin-left:auto}
    .icon-btn{width:auto}
  }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">LU<span>MEN</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html" class="active">Shop</a>
    <a href="cart.html">Cart</a>
  </nav>
  <hr class="divider">
  <div class="filters">
    <button class="chip active" onclick="filterCat('all',this)">All</button>
    <button class="chip" onclick="filterCat('Home',this)">Home</button>
    <button class="chip" onclick="filterCat('Tech',this)">Tech</button>
    <button class="chip" onclick="filterCat('Wear',this)">Wear</button>
    <button class="chip" onclick="filterCat('Kitchen',this)">Kitchen</button>
  </div>
  <div class="side-tools">
    <button class="icon-btn" onclick="demo('Search')">🔍 Search</button>
    <button class="icon-btn" onclick="demo('Account login')">Account</button>
    <a href="cart.html" class="cart-link"><button class="icon-btn">🛒 Cart<span class="badge" id="cartBadge">0</span></button></a>
  </div>
</aside>

<main class="content">
  <div class="wrap">
    <div class="page-head">
      <h1>The collection</h1>
      <select onchange="demo('Sort by ' + this.value)">
        <option>Sort: Featured</option>
        <option>Price: Low to High</option>
        <option>Price: High to Low</option>
        <option>Newest</option>
      </select>
    </div>

    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>

  <footer>© 2026 Lumen Demo Store · Built as an HTML demo</footer>
</main>

<div class="toast" id="toast">Added to cart</div>

<script src="app.js"></script>
<script>
  let activeCat = 'all';
  function filterCat(cat, el){
    activeCat = cat;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
    renderShop();
  }
  function renderShop(){
    const list = activeCat==='all' ? PRODUCTS : PRODUCTS.filter(p=>p.cat===activeCat);
    document.getElementById('count').textContent = list.length + ' products';
    document.getElementById('grid').innerHTML = list.map(p=>`
      <div class="card">
        <div class="thumb" style="background:${p.bg}">${p.emoji}${p.tag?`<span class="tag">${p.tag}</span>`:''}</div>
        <div class="card-body">
          <h3>${p.name}</h3>
          <div class="cat">${p.cat}</div>
          <div class="price">$${p.price.toFixed(2)}</div>
          <div class="card-actions">
            <button class="btn" onclick="addToCart(${p.id})">Add to cart</button>
            <button class="wish" onclick="demo('Wishlist')">♡</button>
          </div>
        </div>
      </div>`).join('');
  }
  renderShop();
  updateBadge();
</script>
</body>
</html>
